<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" font-family="Segoe UI, Arial, sans-serif">
  <title>Pêndulo simples e conservação da energia</title>
  <style>
    .balanco { transform-box: view-box; transform-origin: 250px 34px; animation: balancar 2.4s ease-in-out infinite alternate; }
    @keyframes balancar { from { transform: rotate(45deg); } to { transform: rotate(-45deg); } }
  </style>
  <rect width="500" height="340" rx="16" fill="#eef6f5"/>
  <!-- suporte -->
  <rect x="170" y="20" width="160" height="14" rx="4" fill="#14213d"/>
  <!-- trajetória -->
  <path d="M110,186 A200,200 0 0 0 390,186" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- posições A e C (fantasma) -->
  <line x1="250" y1="34" x2="109" y2="176" stroke="#94a3b8" stroke-width="2" opacity="0.5"/>
  <circle cx="109" cy="176" r="20" fill="#e76f51" opacity="0.35"/>
  <line x1="250" y1="34" x2="391" y2="176" stroke="#94a3b8" stroke-width="2" opacity="0.5"/>
  <circle cx="391" cy="176" r="20" fill="#e76f51" opacity="0.35"/>
  <!-- posição B (fantasma) -->
  <circle cx="250" cy="234" r="22" fill="#2a9d8f" opacity="0.3"/>
  <!-- pêndulo em movimento -->
  <g class="balanco">
    <line x1="250" y1="34" x2="250" y2="234" stroke="#14213d" stroke-width="3"/>
    <circle cx="250" cy="234" r="22" fill="#2a9d8f" stroke="#14213d" stroke-width="2"/>
  </g>
  <circle cx="250" cy="34" r="5" fill="#14213d"/>
  <!-- altura -->
  <line x1="80" y1="176" x2="80" y2="234" stroke="#e76f51" stroke-width="2"/>
  <line x1="74" y1="176" x2="86" y2="176" stroke="#e76f51" stroke-width="2"/>
  <line x1="74" y1="234" x2="86" y2="234" stroke="#e76f51" stroke-width="2"/>
  <line x1="86" y1="234" x2="228" y2="234" stroke="#e76f51" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="56" y="211" fill="#e76f51" font-size="18" font-style="italic" font-weight="700">h</text>
  <!-- rótulos -->
  <text x="96" y="150" fill="#14213d" font-size="18" font-weight="800">A</text>
  <text x="244" y="275" fill="#14213d" font-size="18" font-weight="800">B</text>
  <text x="396" y="150" fill="#14213d" font-size="18" font-weight="800">C</text>
  <text x="250" y="305" fill="#14213d" font-size="14" text-anchor="middle">A e C: v = 0 (só Ep)  •  B: v máxima (só Ec)</text>
  <text x="250" y="326" fill="#2a9d8f" font-size="14" font-weight="700" text-anchor="middle">Sem atrito: Ep(A) = Ec(B) = Ep(C)</text>
</svg>
